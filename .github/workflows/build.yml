name: Build FPGA Bitstream

on:
  push:
    branches: [ master, icesugar ]
  pull_request:
    branches: [ master, icesugar ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/davidsiaw/yosys-docker:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run testbench simulation
        run: |
          make test

      - name: Build bitstream
        run: |
          make clean
          make all

      - name: List output files
        run: ls -lah *.bin *.config 2>/dev/null || echo "Build artifacts ready"

      - name: Upload bitstream artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellosoc_top-bitstream
          path: hellosoc_top.bin
          retention-days: 30
          if-no-files-found: warn

      - name: Upload configuration artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellosoc_top-config
          path: hellosoc_top.config
          retention-days: 30
          if-no-files-found: warn

      - name: Upload synthesis artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellosoc_top-synthesis
          path: hellosoc_top.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload VCD waveform artifact
        uses: actions/upload-artifact@v4
        with:
          name: testbench-waveform
          path: tb_hellosoc.vcd
          retention-days: 30
          if-no-files-found: warn

      - name: Install visualization tools
        run: |
          apt-get update && apt-get install -y python3-pip nodejs npm
          pip3 install vcdvcd==2.3.3
          npm install -g netlistsvg@1.0.0 wavedrom-cli@2.6.8

      - name: Generate waveform graphics
        run: |
          if [ -f tb_hellosoc.vcd ]; then
            # Create a Python script to convert VCD to WaveDrom JSON
            cat > vcd2img.py << 'EOFPY'
#!/usr/bin/env python3
import sys
import os
import json
import subprocess

def vcd_to_wavedrom(vcd_file):
    """Convert VCD file to WaveDrom JSON format"""
    try:
        # Validate file exists
        if not os.path.exists(vcd_file):
            raise FileNotFoundError(f"VCD file not found: {vcd_file}")
        
        from vcdvcd import VCDVCD
        
        vcd = VCDVCD(vcd_file)
        base_name = os.path.splitext(os.path.basename(vcd_file))[0]
        
        # Create WaveDrom JSON
        wavedrom = {
            "signal": [],
            "config": {"hscale": 2}
        }
        
        # Get signals (limit to avoid overcrowding)
        max_signals = 20
        max_samples = 100
        signals = list(vcd.signals.keys())[:max_signals]
        
        for sig_name in signals:
            signal = vcd[sig_name]
            wave_str = ""
            
            # Convert VCD values to WaveDrom format
            # Sample signal changes to create wave representation
            samples = signal.tv[:max_samples]
            
            for i, tv in enumerate(samples):
                val = tv[1]
                # Convert to WaveDrom wave characters
                if val == '0':
                    wave_str += '0'
                elif val == '1':
                    wave_str += '1'
                elif val in ['x', 'X']:
                    wave_str += 'x'
                elif val in ['z', 'Z']:
                    wave_str += 'z'
                else:
                    # For multi-bit values, use '=' for data
                    wave_str += '='
                
                # Add period marker for better visualization
                if i < len(samples) - 1:
                    wave_str += '.'
            
            if wave_str:
                wavedrom["signal"].append({
                    "name": sig_name.split('.')[-1],
                    "wave": wave_str
                })
        
        # Save WaveDrom JSON
        json_file = f"{base_name}_wavedrom.json"
        with open(json_file, 'w') as f:
            json.dump(wavedrom, f, indent=2)
        
        print(f"Generated WaveDrom JSON: {json_file}")
        
        # Try to convert to SVG using wavedrom-cli if available
        try:
            svg_file = f"{base_name}_waveform.svg"
            subprocess.run(['wavedrom-cli', '-i', json_file, '-s', svg_file], check=True, timeout=60)
            print(f"Generated SVG: {svg_file}")
        except (subprocess.CalledProcessError, FileNotFoundError) as e:
            print(f"Could not generate SVG: {e}")
            # Create a simple info file
            info_file = f"{base_name}_waveform_info.txt"
            with open(info_file, 'w') as f:
                f.write(f"VCD waveform file generated: {vcd_file}\n")
                f.write(f"WaveDrom JSON available: {json_file}\n")
                f.write(f"File size: {os.path.getsize(vcd_file)} bytes\n")
            print(f"Generated info file: {info_file}")
        except subprocess.TimeoutExpired:
            print(f"SVG generation timed out after 60 seconds")
        
        return json_file
        
    except (FileNotFoundError, ImportError, IOError) as e:
        print(f"Error processing VCD: {e}")
        # Create a simple info file as fallback
        base_name = os.path.splitext(os.path.basename(vcd_file))[0]
        info_file = f"{base_name}_waveform_info.txt"
        with open(info_file, 'w') as f:
            f.write(f"VCD waveform file: {vcd_file}\n")
            if os.path.exists(vcd_file):
                f.write(f"File size: {os.path.getsize(vcd_file)} bytes\n")
            f.write(f"Error: {e}\n")
        print(f"Generated info file: {info_file}")
        return info_file

if __name__ == "__main__":
    if len(sys.argv) < 2:
        print("Usage: vcd2img.py <vcd_file>")
        sys.exit(1)
    vcd_to_wavedrom(sys.argv[1])
EOFPY
            chmod +x vcd2img.py
            python3 vcd2img.py tb_hellosoc.vcd || echo "Note: VCD visualization had issues, VCD file is still available"
          fi

      - name: Generate logic diagrams
        run: |
          if [ -f hellosoc_top.json ]; then
            # Generate netlist diagram from synthesis JSON
            netlistsvg hellosoc_top.json -o hellosoc_top_diagram.svg || echo "Note: netlistsvg generation had issues"
          fi

      - name: Upload waveform graphics artifact
        uses: actions/upload-artifact@v4
        with:
          name: testbench-graphics
          path: |
            *_waveform.svg
            *_waveform_info.txt
            *_wavedrom.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload logic diagrams artifact
        uses: actions/upload-artifact@v4
        with:
          name: logic-diagrams
          path: |
            *_diagram.svg
          retention-days: 30
          if-no-files-found: warn
